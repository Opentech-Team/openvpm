# Demo deployment on a single small host, layered on docker-compose.yml:
#
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.demo.yml \
#     --env-file docker/.env.demo up -d --build
#
# docker/.env.demo is not versioned; see docker/.env.demo.example.
# - Postgres and object storage only listen on 127.0.0.1 (the base file publishes them).
# - Secrets and passwords come from the env file instead of the dev defaults.
# - MinIO no longer publishes free images (docker.io and quay.io refuse the pull),
#   so the S3 service runs SeaweedFS, as the Japanese localization
#   (katsushi2441/openvpm-jp) does. The service keeps the name "minio".
# - UI language and the build heap size are build args.
services:
  postgres:
    ports: !override
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}

  minio:
    image: chrislusf/seaweedfs:latest
    entrypoint: !override
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/seaweedfs
        printf '{"identities":[{"name":"openpims","credentials":[{"accessKey":"openpims","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}' "$$S3_SECRET" > /etc/seaweedfs/s3.json
        exec weed server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    command: !reset []
    environment: !override
      S3_SECRET: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes: !override
      - minio_data:/data
    ports: !override
      - "127.0.0.1:9000:9000"

  minio-bootstrap:
    image: chrislusf/seaweedfs:latest
    depends_on: !override
      minio:
        condition: service_started
    entrypoint: !override
      - /bin/sh
      - -c
      - |
        until echo "s3.bucket.list" | weed shell -master=minio:9333 >/dev/null 2>&1; do sleep 2; done
        echo "s3.bucket.create -name openpims" | weed shell -master=minio:9333
        echo "s3.bucket.list" | weed shell -master=minio:9333

  web:
    build:
      args:
        NEXT_PUBLIC_OPENVPM_LANGUAGE: ${OPENVPM_LANGUAGE:-es-VE}
        NODE_OPTIONS: ${BUILD_NODE_OPTIONS:---max-old-space-size=3072}
    environment:
      DATABASE_URL: postgresql://openpims:${POSTGRES_PASSWORD}@postgres:5432/openpims
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?set NEXTAUTH_URL}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
